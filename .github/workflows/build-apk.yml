name: Build LifeOS APK

# Builds the app on every push to main and publishes it as the latest
# GitHub release. The app checks that release to tell you about updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 secret (Settings > Secrets and variables > Actions). Without the same key, new builds can't update the installed app."
            exit 1
          fi
          # Phones often add spaces or line breaks when copying; drop them.
          clean=$(printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d ' \r\n\t')
          echo "Secret length after cleanup: ${#clean} characters (expected 3452)"
          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
            echo "::error::SIGNING_KEYSTORE_B64 is not valid base64 (${#clean} characters, expected 3452). Paste the full key text again."
            exit 1
          fi
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass vaazhkai123 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signing key fingerprint: $fp"
          if [ "$fp" != "B7:45:69:79:79:FF:76:38:DD:D8:4E:8B:96:FD:CB:94:61:A7:F9:53:16:49:B2:45:21:D4:28:CA:E3:87:BE:BD" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 decodes, but it is not the LifeOS signing key. Paste the full key text again."
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # Version codes start at 100 so they stay above builds made before this repo existed.
      - name: Version
        run: echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "LifeOS-1.0.$VERSION_CODE.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: LifeOS 1.0.${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download the .apk below on your Android phone and open it to install.
            Installing over an older LifeOS keeps all your data.
          files: LifeOS-1.0.*.apk
