name: Build LifeOS APK

# Builds the app on every push to main and publishes it as the latest
# GitHub release. The app checks that release to tell you about updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 secret (Settings > Secrets and variables > Actions). Without the same key, new builds can't update the installed app."
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # Version codes start at 100 so they stay above builds made before this repo existed.
      - name: Version
        run: echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "LifeOS-1.0.$VERSION_CODE.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: LifeOS 1.0.${{ env.VERSION_CODE }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download the .apk below on your Android phone and open it to install.
            Installing over an older LifeOS keeps all your data.
          files: LifeOS-1.0.*.apk
