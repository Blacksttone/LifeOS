      if (!isFinite(saved) || saved < 0){ toast("Saved so far must be a number."); return; }
      data = {kind:"goal", mode:"money", title, area, amount, saved, contrib:{}, created:Date.now()};

    if (by < start){ toast("\"Reach it by\" must be on or after \"Start from\"."); return; }
    data.start = start; data.by = by;
    state.goalTitle = ""; state.goalAmount = ""; state.goalArea = area;
    clear("g-title","g-amt","g-saved");
    ["g-start","g-by"].forEach(x => { const el = document.getElementById(x); if (el) el.dataset.keep = "no"; });
    setItem(newId(), data);
    if (data.mode==="money") toast(`Goal added · put aside ${inr(goalMoney(data).needed)} a month`); else toast("Goal added");
  }
  if (f.id==="tx-form"){
    const amount = num(val("tx-amt"));
    if (!isFinite(amount) || amount <= 0){ toast("Enter the amount in rupees."); document.getElementById("tx-amt").focus(); return; }
    const date = val("tx-date") || dayKey(state.now);
    clear("tx-amt","tx-note");
    setItem(newId(), {kind:"txn", type:state.txType, amount, category:val("tx-cat"), note:val("tx-note").trim() || "", date, created:Date.now()});
    toast(`${state.txType==="income"?"Income":"Expense"} added · ${inr(amount)}`);
  }
  if (f.id==="budget-form"){
    const v = val("b-total").trim()==="" ? 0 : num(val("b-total"));
    if (!isFinite(v) || v < 0){ toast("Enter the budget in rupees."); return; }
    saveSettings({budget:v}); toast(v ? `Budget set to ${inr(v)}` : "Budget removed");
  }
  if (f.id==="w-form" && !state.liabMode && LIVE_TYPES[val("w-type")] && state.wPick){
    const pick = state.wPick, units = num(val("w-units")), avg = val("w-avg").trim() ? num(val("w-avg")) : 0;
    if (!isFinite(units) || units <= 0){ toast(pick.src==="mf" ? "Enter the number of units." : "Enter how many shares you hold."); return; }
    if (!isFinite(avg) || avg < 0){ toast("Average price must be a number."); return; }
    const name = val("w-name").trim() || pick.label, id = newId();
    clear("w-name","w-units","w-avg","w-q"); state.wPick = null; state.wResults = [];
    setItem(id, {kind:"asset", type:val("w-type"), name, live:{src:pick.src, id:pick.id}, units, avg, value:0, created:Date.now(), updated:Date.now()});
    toast("Added · getting the latest price…");
    refreshPrices(true);
    return;
  }
  if (f.id==="w-form"){
    const name = val("w-name").trim(), v = num(val("w-val"));
    if (!name){ toast("Give it a name."); return; }
    if (!isFinite(v) || v < 0){ toast("Enter the value in rupees."); return; }
    const type = val("w-type"), data = {kind: state.liabMode ? "liability" : "asset", name, type, value:v, created:Date.now(), updated:Date.now()};
    if (!state.liabMode && type===P2P){
      const r = num(val("w-rate")), m = val("w-monthly").trim() ? num(val("w-monthly")) : 0, n = parseInt(val("w-tenure"),10);
      if (!isFinite(r) || r <= 0 || r > 100){ toast("Enter the interest rate, e.g. 35."); return; }
      if (!isFinite(m) || m < 0){ toast("Monthly contribution must be a number."); return; }
      if (!(n >= 1 && n <= 120)){ toast("Loan tenure must be 1 to 120 months."); return; }
      Object.assign(data, {rate:r, monthly:m, freq: FREQ[val("w-freq")] ? val("w-freq") : "monthly", tenure:n, reinvest: !!(document.getElementById("w-reinvest")||{}).checked, p2pLog:{}, addLog:{}});
    }
    clear("w-name","w-val","w-monthly");
    setItem(newId(), data);
    if (data.rate) toast(`Added · about ${inr(p2pMonthlyInterest(data))} interest a month`);
  }
  if (f.id==="hg-form"){
    const g = k => num(val(k));
    const patch = {waterGoal:g("g-water"), sleepGoal:g("g-sleep"), stepsGoal:g("g-steps"), workoutGoal:g("g-workout")};
    if (Object.values(patch).some(v => !isFinite(v) || v <= 0)){ toast("Each goal needs a number above zero."); return; }
    saveSettings(patch); toast("Goals saved");
  }
  if (f.id==="xk-form"){
    const t = valOf("xk-in").trim(); if (!t || !state.xOpen) return;
    const el = document.getElementById("xk-in"); if (el) el.value = "";
    setItem(newId(), {kind:"xnote", expert:state.xOpen, text:t.slice(0, 1200), created:Date.now()});
    toast("Note added. This expert will remember it."); return;
  }
  if (f.id==="x-form"){
    const t = valOf("x-in").trim(); if (!t || !state.xOpen) return;
    const el = document.getElementById("x-in"); if (el) el.value = "";
    if (!hasExpertKey()){ const ex = EXPERTS.find(x => x.k===state.xOpen); if (ex) askInClaude(ex, t); return; }
    askExpert(state.xOpen, t); return;
  }
  if (f.id==="home-todo"){
    const title = val("ht-title").trim(); if (!title) return;
    clear("ht-title");
    setItem(newId(), {kind:"todo", title, area:guessArea(title), done:false, created:Date.now()});
    toast("To-do added");
    return;
  }
  if (f.id==="pl-form"){
    const name = val("pl-name").trim(); if (!name){ toast("Name the place, e.g. Home."); return; }
    const pasted = val("pl-coords").trim(), parsed = pasted ? parseCoords(pasted) : null;
    if (pasted && !parsed){ toast(/goo\.gl|g\.co/.test(pasted) ? "Short map links can't be read. In Google Maps, press and hold the place, then copy the numbers shown (like 12.97, 80.22) and paste them." : "Couldn't read coordinates. Paste numbers like 12.97, 80.22 or a full Google Maps link."); return; }
    const loc = parsed || state.plFound;
    if (!loc){ toast("Tap Use my current location, or paste the place's map link."); return; }
    const radius = Number(val("pl-radius")) || 200;
    clear("pl-name","pl-coords"); state.plFound = null;
    setItem(newId(), {kind:"place", name, lat:loc.lat, lng:loc.lng, radius, created:Date.now()});
    toast(`Saved ${name}`);
    return;
  }
  if (f.id==="gr-form"){
    const title = val("gr-title").trim(), placeId = val("gr-place"), when = val("gr-when")==="enter" ? "enter" : "exit";
    if (!title){ toast("Type what to remind you about."); return; }
    if (!state.items.get(placeId)){ toast("Pick a place."); return; }
    clear("gr-title");
    if (bridge && !notifAllowed()){ try { bridge.requestNotifications(); } catch(_){} }
    setItem(newId(), {kind:"georem", title, placeId, when, days:(state.grDays || ALL_DAYS).slice(), enabled:true, created:Date.now()});
    const st = geoStatus();
    toast(st==="background" ? "Location reminder set" : "Saved. Allow location all the time so it works in the background.");
    return;
  }
  if (f.id==="rem-form"){
    const title = val("r-title").trim(), time = val("r-time"), repeat = val("r-repeat");
    if (!title){ toast("Type what to remind you about."); document.getElementById("r-title").focus(); return; }
    if (!/^\d\d:\d\d$/.test(time)){ toast("Pick a time."); return; }
    const dom = parseInt(val("r-dom"), 10);
    if (repeat==="monthly" && !(dom >= 1 && dom <= 31)){ toast("Day of the month must be 1 to 31."); return; }
    const days = (state.rDays || ALL_DAYS).slice().sort(), rp = repeat==="days" ? (days.length===7 ? "daily" : "days") : repeat;
    const r = {kind:"reminder", title, time, alarm: !!(document.getElementById("r-alarm")||{}).checked, repeat: rp, days: rp==="days" ? days : [], date: repeat==="once" ? val("r-date") : "", dom: repeat==="monthly" ? dom : 1, enabled:true, created:Date.now()};
    if (repeat==="once" && !nextFire(r, new Date())){ toast("That date and time has already passed."); return; }
    clear("r-title"); addReminder(r);
  }
});

/* clock: roll over at midnight, refresh "next" labels */
setInterval(()=>{
  const n = new Date(), changed = dayKey(n)!==dayKey(state.now); state.now = n;
  if (changed && state.jdraft && !hasContent(state.jdraft)){ state.jdate = null; state.jdraft = null; }
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (changed || (!typing && !state.editing && (state.tab==="home" || state.tab==="more" || state.tab==="plan"))) render();
}, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ state.now = new Date(); const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName); if (!typing) render(); } });

/* one-time upgrade: savings funds from the earlier version become money goals,
   yearly tasks get a period (this year), and the old time windows are dropped */
{
  let moved = 0;
  const y = state.now.getFullYear();
  for (const [id,v] of [...state.items.entries()]){
    if (v && v.kind==="yearly" && !v.period){
      const doneAt = (v.log||{})[String(y)];
      state.items.set(id, {...v, period:{from:`${y}-01`, to:`${y}-12`}, done:!!doneAt, doneAt: typeof doneAt==="number" ? doneAt : (doneAt ? Date.now() : null)});
      moved++;
    }
    if (v && v.win){ const n = {...state.items.get(id)}; delete n.win; state.items.set(id, n); moved++; }
  }
  for (const [id,v] of [...state.items.entries()]) if (v && v.kind==="fund"){
    state.items.set(id, {kind:"goal", mode:"money", title:v.name||"Savings fund", area:"wealth", amount:Number(v.target)||0, saved:Number(v.saved)||0,
      by:monthKey(new Date(state.now.getFullYear()+1, state.now.getMonth(), 1)), contrib:{}, created:v.created||Date.now()});
    moved++;
  }
  if (moved) persist();
}
if (state.items.size && byKind("asset").length + byKind("liability").length) { snapshotNetWorth(); persist(); }
syncReminders();
syncGeofences();
render();
checkUpdate(false);
refreshPrices(false);
setTimeout(autoBackup, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ maybeCheckUpdate(); applyNativeDone(); } });
applyNativeDone();
})();
</script>
