<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Sticky top bar, one scrolling content column, fixed bottom tab bar (Home, Plan, Money, Health, More). White surfaces, one blue. */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --ink:#0f1b2d; --muted:#5d6b80; --faint:#8a96a8; --line:#e2e7ef;
  --blue:#1f5fd6; --blue-ink:#174bab; --blue-soft:#e9f0fd; --blue-tint:#f5f8fe;
  --good:#11845a; --good-soft:#e2f4ec; --bad:#c4372f; --bad-soft:#fcebea; --warn:#a86400; --warn-soft:#fdf1df;
  --head:"Manrope","Inter",ui-sans-serif,system-ui,Roboto,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f6fe4,#1747a6);display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:34px;height:34px}
.brand h1{font-size:19px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:500;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.iconbtn .badge{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--blue)}

main{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px);display:flex;flex-direction:column;gap:16px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line)}
.nav .in{max-width:760px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(6,1fr)}
.mindmap{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.mindmap text{font-family:var(--body)}
.mindmap g[data-act]{cursor:pointer}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tips li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:8px}
.tips .main{gap:6px}
.tips .btn{align-self:flex-start;padding:6px 12px;font-size:12px}
.mini{display:flex;flex-direction:column;gap:5px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.nav svg{width:22px;height:22px;stroke:currentColor}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] .pill{background:var(--blue-soft)}
.nav .pill{padding:3px 14px;border-radius:99px;display:grid;place-items:center}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tap{cursor:pointer;text-align:left}
.card h3{font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--head);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.mid{font-family:var(--head);font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h2{font-size:22px;font-weight:800}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.bar.good i{background:var(--good)} .bar.bad i{background:var(--bad)} .bar.warn i{background:var(--warn)}

.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--blue-soft) 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:14px}

.field{width:100%;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.field::placeholder{color:var(--faint)}
.field:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
textarea.field{min-height:80px;resize:vertical;line-height:1.5}
form.stack,.stack{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline > .field{flex:1 1 160px}
.btn{padding:11px 18px;border-radius:11px;border:0;background:var(--blue);color:#fff;font-weight:600;white-space:nowrap}
.btn:active{background:var(--blue-ink)}
.btn.ghost{background:var(--surface);color:var(--blue);border:1px solid var(--line)}
.btn.block{width:100%}
.toggle2{display:grid;grid-template-columns:1fr 1fr;background:var(--blue-tint);border:1px solid var(--line);border-radius:11px;padding:3px}
.toggle2 button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.toggle2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}

ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
ul.list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
ul.list li:first-child{border-top:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #b8c3d4;background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0;stroke:#fff}
li.done .check{background:var(--blue);border-color:var(--blue)}
li.done .check svg{opacity:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.title{overflow-wrap:anywhere;font-weight:500}
li.done .title{color:var(--faint);text-decoration:line-through}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--blue)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue-ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.del{flex:none;border:0;background:transparent;color:var(--faint);padding:6px;border-radius:8px;font-size:12px;font-weight:600}
.del.arm{color:var(--bad);background:var(--bad-soft)}
.amt{font-family:var(--head);font-weight:700;white-space:nowrap}
.cat{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.cat.inc{background:var(--good-soft);color:var(--good)}
.dayhead{padding:8px 14px;background:var(--blue-tint);font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav strong{font-family:var(--head);font-size:16px}
.monthnav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:36px}
.monthnav button:disabled{opacity:.35}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;color:var(--blue)}
.stepper .val{min-width:56px;text-align:center}
.metric{display:flex;flex-direction:column;gap:8px}
.metric .field{padding:9px 11px}
.unit{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--body)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}

.goal .progress{display:flex;align-items:center;gap:10px}
.goal .progress .bar{flex:1;height:8px}
.step{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:32px;padding:0;color:var(--blue);font-weight:700}

.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.mood[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.flabel{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.flabel span{color:var(--muted);font-weight:400}
.entry{cursor:pointer;align-items:flex-start!important}
.entry .d{flex:none;width:46px;text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.entry .d b{display:block;font-family:var(--head);font-size:19px;color:var(--ink)}
.excerpt{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.rtime{flex:none;font-family:var(--head);font-weight:800;font-size:19px;min-width:58px}
li.off .rtime,li.off .title{color:var(--faint)}
.switch{flex:none;width:44px;height:26px;border-radius:99px;border:0;background:#cdd5e1;position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{left:21px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px dashed #b8c3d4;background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--blue-ink)}

.notice{padding:12px 14px;border-radius:12px;background:var(--blue-soft);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed #c9d2df;border-radius:16px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty p{margin:0;max-width:42ch}
.sub{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.xtile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.xtile .xe{font-size:26px;line-height:1}
.xtile b{font-family:var(--head);font-size:15px}
.xtile span{font-size:12px;color:var(--muted)}
.xtile .xc{font-size:11px;color:var(--blue-ink);font-weight:600}
.chatlog{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.ai p{margin:0 0 8px}.bub.ai p:last-child{margin:0}
.bub.ai ul,.bub.ai ol{margin:4px 0 8px;padding-left:20px}
.bub.ai h4{margin:8px 0 4px;font-family:var(--head);font-size:14px}
.bub.err{align-self:flex-start;background:var(--bad-soft);color:var(--bad)}
.srcs{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.srcs a{font-size:12px;color:var(--blue-ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.quick svg{width:22px;height:22px;stroke:var(--blue)}
.chip.now{background:var(--blue);color:#fff}
ul.list li.active{background:var(--blue-tint);box-shadow:inset 3px 0 0 var(--blue)}
ul.list li.editor{flex-direction:column;align-items:stretch;gap:10px;background:var(--blue-tint)}
.wintime{font-weight:600;color:var(--ink)}
.winbox{flex:1 1 100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.winbox summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--blue-ink)}
.winbox[open] summary{margin-bottom:10px}
.calc{display:flex;flex-direction:column;justify-content:center;background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue-ink);font-family:var(--head);font-weight:800;min-height:46px;line-height:1.2}
.calc small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.ptable td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ptable td:not(:first-child),.ptable th:not(:first-child){text-align:right}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;color:var(--muted);padding:0}
.days button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.days.small button{width:30px;height:30px;font-size:11px}
ul.list li.wrap{flex-wrap:wrap}
.daysrow{flex-basis:100%;padding-left:70px;margin-top:-2px}
.checkline{display:flex;align-items:center;gap:10px;font-size:14px}
.checkline input{width:20px;height:20px;accent-color:var(--blue)}
.update{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--blue);color:#fff;text-decoration:none}
.update b{font-family:var(--head)}
.update .tiny{color:#dbe6fb}
.update .btn{background:#fff;color:var(--blue);flex:none}
.nav .dot{position:absolute;margin:-18px 0 0 18px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 108 108" aria-hidden="true"><circle cx="54" cy="54" r="27" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="7"/><path d="M54 27A27 27 0 1 1 29.5 66" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M40 62L50 52L57 58L69 45M62 45H69V52" fill="none" stroke="#7ee0b0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><h1>LifeOS</h1><small id="today"></small></div>
  </div>
  <button class="iconbtn" data-act="go" data-tab="more" data-more="reminders" aria-label="Reminders">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 004 0"/></svg>
    <span class="badge" id="bell-badge" hidden></span>
  </button>
</div></header>

<main id="main" aria-live="polite"></main>

<nav class="nav" aria-label="Sections"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const PLAN = [
  {k:"daily",   label:"Daily",   period:"day",   placeholder:"Add a daily habit, e.g. Workout 30 min"},
  {k:"todo",    label:"To-do",   period:null,    placeholder:"Add a one-time task"},
  {k:"weekly",  label:"Weekly",  period:"week",  placeholder:"Add a weekly task, e.g. Review spending"},
  {k:"monthly", label:"Monthly", period:"month", placeholder:"Add a monthly task, e.g. Invest SIP"},
  {k:"yearly",  label:"Yearly",  period:"year",  placeholder:"Add a task for this year"}
];
const AREAS = [
  {k:"health",   label:"Health",   goal:"Run 5 km without stopping",      habit:"Workout 30 minutes"},
  {k:"wealth",   label:"Wealth",   goal:"Build a 6-month emergency fund", habit:"Log today's expenses"},
  {k:"work",     label:"Work",     goal:"Finish this quarter's main project", habit:"Plan tomorrow's work before leaving"},
  {k:"career",   label:"Career",   goal:"Move to a better-paying role",   habit:"1 hour of focused skill work"},
  {k:"learning", label:"Learning", goal:"Finish one online course",       habit:"Read 10 pages"},
  {k:"family",   label:"Family",   goal:"Plan a family trip",             habit:"Call parents"},
  {k:"mind",     label:"Mind",     goal:"Build a calm morning routine",   habit:"10 minutes meditation"},
  {k:"personal", label:"Personal", goal:"Learn to swim",                  habit:"Wake up before 6 AM"}
];
const areaOf = k => AREAS.find(a=>a.k===k) || AREAS.find(a=>a.k==="personal");
function guessArea(t){
  t = String(t||"").toLowerCase();
  if (/work ?out|gym|run|walk|water|sleep|diet|health|weight|yoga|steps|fit|doctor|insurance|checkup/.test(t)) return "health";
  if (/sav|invest|sip|bill|budget|debt|loan|expense|spend|money|fund|income|salary|stock|trad|emi|wealth|rich/.test(t)) return "wealth";
  if (/\bwork\b|office|meeting|project|deadline|report|client|presentation|email|boss|team|shift/.test(t)) return "work";
  if (/career|job|promot|business|interview|resume|skill/.test(t)) return "career";
  if (/read|learn|course|study|book|exam|language|class/.test(t)) return "learning";
  if (/family|call|parent|amma|appa|friend|wife|husband|kid|trip/.test(t)) return "family";
  if (/journal|meditat|pray|gratitude|mind|calm|stress|mood/.test(t)) return "mind";
  return "personal";
}
const itemArea = v => (v && v.area) || guessArea(v && (v.title || v.name));
const areaOptions = sel => AREAS.map(a=>`<option value="${a.k}" ${a.k===sel?"selected":""}>${a.label}</option>`).join("");
const STARTER = [
  ["daily","Wake up before 6 AM","personal"],["daily","Workout 30 minutes","health"],["daily","Read 10 pages","learning"],["daily","Log today's expenses","wealth"],
  ["todo","Write down this month's budget","wealth"],
  ["weekly","Review spending","wealth"],["weekly","Call family","family"],["weekly","Learn one new skill topic","career"],
  ["monthly","Invest SIP","wealth"],["monthly","Pay all bills on time","wealth"],
  ["yearly","Full health checkup","health"],["yearly","Renew health insurance","health"]
];
const EXP_CATS = ["Food","Groceries","Transport","Rent","Bills","Shopping","Health","Education","Entertainment","EMI / Loan","Family","Travel","Other"];
const INC_CATS = ["Salary","Business","Trading","Freelance","Interest","Gift","Other"];
const P2P = "LenDenClub / P2P";

/* Weekdays a repeating reminder fires on (0 = Sunday … 6 = Saturday), or null for monthly / once. */
function remDays(r){
  if (r.repeat==="once" || r.repeat==="monthly") return null;
  if (r.repeat==="days" && Array.isArray(r.days) && r.days.length) return r.days.slice().sort();
  if (r.repeat==="weekdays") return [1,2,3,4,5];
  if (r.repeat==="weekends") return [0,6];
  return [0,1,2,3,4,5,6];
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseDay = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d||1); };
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return {y, w: Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7)};
}
function periodKey(p, d){
  if (p==="day") return dayKey(d);
  if (p==="week"){ const {y,w}=isoWeek(d); return `${y}-W${pad(w)}`; }
  if (p==="month") return monthKey(d);
  return String(d.getFullYear());
}
function shift(p, d, n){
  if (p==="day")  return new Date(d.getFullYear(), d.getMonth(), d.getDate()-n);
  if (p==="week") return new Date(d.getFullYear(), d.getMonth(), d.getDate()-7*n);
  if (p==="month")return new Date(d.getFullYear(), d.getMonth()-n, 15);
  return new Date(d.getFullYear()-n, 6, 1);
}
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function periodInfo(p, d){
  const start0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (p==="day"){ const mins = (d - start0)/6e4; return {text:`${DAYS[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`, elapsed:mins/1440, left:`${Math.max(0,Math.ceil((1440-mins)/60))} h left today`}; }
  if (p==="week"){
    const dow = (d.getDay()+6)%7, s = new Date(start0); s.setDate(s.getDate()-dow);
    const e = new Date(s); e.setDate(e.getDate()+6); const left = 6-dow;
    const range = s.getMonth()===e.getMonth() ? `${s.getDate()}–${e.getDate()} ${MON[e.getMonth()]}` : `${s.getDate()} ${MON[s.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]}`;
    return {text:`Week ${isoWeek(d).w} · ${range}`, elapsed:(dow+1)/7, left: left===0 ? "Last day of the week" : `${left} day${left>1?"s":""} left`};
  }
  if (p==="month"){ const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), left = days - d.getDate();
    return {text:`${MONTH[d.getMonth()]} ${d.getFullYear()}`, elapsed:d.getDate()/days, left: left===0 ? "Last day of the month" : `${left} day${left>1?"s":""} left`}; }
  const y = d.getFullYear(), total = Math.round((new Date(y+1,0,1)-new Date(y,0,1))/864e5), done = Math.round((start0-new Date(y,0,1))/864e5)+1;
  return {text:String(y), elapsed:done/total, left:`${total-done} days left in ${y}`};
}

/* ---------- money format ---------- */
const inr = n => "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN");
const sinr = n => (n < 0 ? "−" : "") + inr(n);
function short(n){
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e7) return `${s}₹${(a/1e7).toFixed(a>=1e8?0:2).replace(/\.?0+$/,"")} Cr`;
  if (a >= 1e5) return `${s}₹${(a/1e5).toFixed(a>=1e6?1:2).replace(/\.?0+$/,"")} L`;
  return s + inr(a);
}

function remDoneToday(id, r){
  if (r.link){
    const it = state.items.get(r.link);
    if (it && it.kind==="todo") return !!it.done;
    if (it && planOf(it.kind) && planOf(it.kind).period) return isDone(it, planOf(it.kind), state.now);
  }
  return !!(r.doneLog || {})[dayKey(state.now)];
}
function toggleRemDone(id){
  const r = state.items.get(id); if (!r) return;
  const it = r.link ? state.items.get(r.link) : null;
  if (it && it.kind==="todo"){ updateItem(r.link, {done:!it.done, doneAt: it.done ? null : Date.now()}); return; }
  if (it && planOf(it.kind) && planOf(it.kind).period){
    const kd = planOf(it.kind), key = periodKey(kd.period, state.now), log = {...(it.log||{})};
    if (log[key]) delete log[key]; else log[key] = Date.now();
    updateItem(r.link, {log}); return;
  }
  const dl = {...(r.doneLog || {})}, k = dayKey(state.now);
  if (dl[k]) delete dl[k]; else dl[k] = Date.now();
  for (const key of Object.keys(dl)) if (key < dayKey(shift("day", state.now, 60))) delete dl[key];
  updateItem(id, {doneLog: dl});
}

/* "12.97, 80.22", or a Google Maps link with @lat,lng / q=lat,lng / ll=lat,lng / !3dlat!4dlng */
function parseCoords(text){
  const t = String(text||"");
  const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/, /[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i, /(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/];
  for (const re of pats){ const m = re.exec(t); if (m){ const lat = parseFloat(m[1]), lng = parseFloat(m[2]); if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return {lat, lng}; } }
  return null;
}

const byKind = k => [...state.items.entries()].filter(([,v]) => v && v.kind===k).sort((a,b)=>(a[1].created||0)-(b[1].created||0));
function isDone(item, kd, d){
  if (item.kind==="yearly") return !!item.done;
  if (kd.period) return !!(item.log && item.log[periodKey(kd.period, d)]);
  if (item.kind==="todo") return !!item.done;
  return (item.progress||0) >= 100;
}
function streak(log){
  let d = state.now, n = 0;
  if (!log[dayKey(d)]) d = shift("day", d, 1);
  while (log[dayKey(d)]) { n++; d = shift("day", d, 1); }
  return n;
}
const hasContent = j => j && (j.mood || (j.good||"").trim() || (j.better||"").trim() || (j.notes||"").trim());
function journalLog(){ const o = {}; for (const [,j] of byKind("journal")) if (hasContent(j)) o[j.date] = true; return o; }
function planSummary(kd){
  const list = byKind(kd.k).map(([,v])=>v);
  if (kd.k==="goal"){ const avg = list.length ? Math.round(list.reduce((s,g)=>s+(g.progress||0),0)/list.length) : 0; return {done:avg, total:100, list}; }
  if (kd.k==="todo"){ return {done:list.filter(t=>t.done).length, total:list.length, open:list.filter(t=>!t.done).length, list}; }
  return {done:list.filter(v=>isDone(v,kd,state.now)).length, total:list.length, list};
}

/* reminders */
function nextFire(r, now){
  if (r.enabled===false) return null;
  const [h,m] = (r.time||"08:00").split(":").map(Number);
  if (r.repeat==="once"){ if (!r.date) return null; const t = parseDay(r.date); t.setHours(h,m,0,0); return t > now ? t : null; }
  if (r.repeat==="monthly"){
    const dom = Math.min(31, Math.max(1, r.dom||1));
    for (let i=0;i<14;i++){
      const last = new Date(now.getFullYear(), now.getMonth()+i+1, 0).getDate();
      const t = new Date(now.getFullYear(), now.getMonth()+i, Math.min(dom,last), h, m, 0, 0);
      if (t > now) return t;
    }
    return null;
  }
  for (let i=0;i<8;i++){
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i, h, m, 0, 0);
    if (t <= now) continue;
    if (!remDays(r).includes(t.getDay())) continue;

  }

}

/* bar chart: values array of {label, v}, goal optional */
function barChart(vals, goal, fmt){
  const W = 320, H = 130, top = 14, bottom = 20, left = 4, right = 4;
  const max = Math.max(goal||0, ...vals.map(x=>x.v||0), 1);
  const bw = (W-left-right)/vals.length;
  const y = v => top + (H-top-bottom) * (1 - v/max);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Last ${vals.length} days">`;
  s += `<line x1="${left}" x2="${W-right}" y1="${H-bottom}" y2="${H-bottom}" stroke="var(--line)"/>`;
  if (goal){ s += `<line x1="${left}" x2="${W-right}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--blue)" stroke-dasharray="4 4" opacity=".5"/>`; }
  vals.forEach((x,i) => {
    const v = x.v||0, bx = left + i*bw + bw*0.22, w = bw*0.56, by = y(v), h = (H-bottom) - by;
    const last = i===vals.length-1;
    s += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="${last ? "var(--blue)" : "#b9cdf3"}"/>`;
    if (v) s += `<text x="${(bx+w/2).toFixed(1)}" y="${(by-3).toFixed(1)}" text-anchor="middle">${esc(fmt ? fmt(v) : v)}</text>`;
    s += `<text x="${(bx+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(x.label)}</text>`;
  });
  return s + `</svg>`;
}
/* line chart for net worth */
function lineChart(points){
  const W = 320, H = 120, top = 16, bottom = 20, left = 6, right = 6;
  const vs = points.map(p=>p.v); const min = Math.min(...vs, 0), max = Math.max(...vs, 1);
  const x = i => left + (W-left-right) * (points.length===1 ? 0.5 : i/(points.length-1));
  const y = v => top + (H-top-bottom) * (1 - (v-min)/((max-min)||1));
  const path = points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = path + `L${x(points.length-1).toFixed(1)},${H-bottom}L${x(0).toFixed(1)},${H-bottom}Z`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth trend">`;
  s += `<line x1="${left}" x2="${W-right}" y1="${H-bottom}" y2="${H-bottom}" stroke="var(--line)"/>`;
  if (min < 0) s += `<line x1="${left}" x2="${W-right}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  s += `<path d="${area}" fill="var(--blue-soft)"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round"/>`;
  points.forEach((p,i)=>{ s += `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?"start":i===points.length-1?"end":"middle"}">${esc(p.label)}</text>`; });
  const li = points.length-1;
  s += `<circle cx="${x(li).toFixed(1)}" cy="${y(points[li].v).toFixed(1)}" r="4" fill="var(--blue)" stroke="#fff" stroke-width="2"/>`;
  s += `<text x="${Math.min(x(li), W-right).toFixed(1)}" y="${(y(points[li].v)-8).toFixed(1)}" text-anchor="end" style="font-weight:600;fill:var(--ink)">${esc(short(points[li].v))}</text>`;
  return s + `</svg>`;
}

async function checkUpdate(manual){

  try {

    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();

/* Money to put aside in this Plan period: P2P contributions of that type, and (monthly) interest plus goal contributions. */
function planMoney(kind){
  const rows = [], per = {daily:"today", weekly:"this week", monthly:"this month", yearly:"this year"}[kind];
  if (!per) return "";
  for (const [id,a] of byKind("asset")){
    if (!isP2P(a)) continue;
    if (Number(a.monthly) && freqOf(a)===kind){
      const done = p2pAddedThis(a);
      rows.push(`<li class="${done?"done":""}"><button class="check" data-act="p2p-add" data-id="${id}" aria-pressed="${!!done}" aria-label="Contribution to ${esc(a.name)}">${CHECK}</button>
        <div class="main"><span class="title">Lend ${inr(a.monthly)} on ${esc(a.name)}</span><span class="meta"><span>${FREQ[kind].label} contribution</span><span class="chip ${done?"good":""}">${done ? "Added" : "Due " + per}</span></span></div></li>`);
    }
    if (kind==="monthly" && p2pMonthlyInterest(a)){
      const got = ((a.p2pLog||{})[monthKey(state.now)]||{}).int;
      rows.push(`<li class="${got?"done":""}"><button class="check" data-act="p2p-int" data-id="${id}" aria-pressed="${!!got}" aria-label="Interest from ${esc(a.name)}">${CHECK}</button>
        <div class="main"><span class="title">${a.reinvest!==false ? "Re-lend" : "Collect"} ${inr(got || p2pMonthlyInterest(a))} interest · ${esc(a.name)}</span><span class="meta"><span>${Number(a.rate)||0}% a year</span><span class="chip ${got?"good":""}">${got ? "Recorded" : "Due this month"}</span></span></div></li>`);
    }
  }
  if (kind==="monthly"){
    for (const [id,g] of moneyItems()){
      const m = moneyOf(g), done = m.thisMonth >= m.needed;
      rows.push(`<li class="${done?"done":""}"><button class="check" data-act="plan-contrib" data-id="${id}" aria-pressed="${done}" aria-label="Contribution to ${esc(g.title)}">${CHECK}</button>
        <div class="main"><span class="title">Put aside ${inr(m.needed)} for ${esc(g.title)}</span><span class="meta"><span>${g.kind==="yearly" ? "Yearly task" : "Goal"} · ${inr(m.thisMonth)} of ${inr(m.needed)}</span><span class="chip ${done?"good":"warn"}">${done ? "Done" : "Due this month"}</span></span></div></li>`);
    }
  }
  return rows.length ? `<div class="sub">Money ${per}</div><ul class="list">${rows.join("")}</ul>` : "";
}

/* ---------- P2P lending (LenDenClub): monthly interest, reinvested, plus monthly top-ups ---------- */
const isP2P = a => a && a.kind==="asset" && a.type===P2P;
function p2pPlan(bal, ratePct, monthly, reinvest, months){
  const i = (Number(ratePct)||0)/100/12; let b = Number(bal)||0, interest = 0; const rows = [];
  for (let k=1;k<=months;k++){ const int = b*i; interest += int; if (reinvest) b += int; b += Number(monthly)||0; rows.push({k, int, b}); }
  return {rows, end:b, interest, added:(Number(monthly)||0)*months};
}
const p2pMonthlyInterest = a => Math.round((Number(a.value)||0) * (Number(a.rate)||0)/100/12);
/* Contributions can be daily, weekly, monthly or yearly; "monthly" holds the amount per period. */
const FREQ = {daily:{label:"Daily", per:"day", p:"day", perMonth:30.4375}, weekly:{label:"Weekly", per:"week", p:"week", perMonth:365.25/7/12},
              monthly:{label:"Monthly", per:"month", p:"month", perMonth:1}, yearly:{label:"Yearly", per:"year", p:"year", perMonth:1/12}};
const freqOf = a => FREQ[a && a.freq] ? a.freq : "monthly";
const p2pPerMonth = a => (Number(a.monthly)||0) * FREQ[freqOf(a)].perMonth;
function p2pAddedThis(a){
  const f = freqOf(a), v = (a.addLog||{})[periodKey(FREQ[f].p, state.now)];
  if (v) return Number(v);
  return f==="monthly" ? Number(((a.p2pLog||{})[monthKey(state.now)]||{}).add)||0 : 0;
}
const freqOptions = sel => Object.entries(FREQ).map(([k,f]) => `<option value="${k}" ${k===sel?"selected":""}>${f.label}</option>`).join("");
function p2pPreview(){
  const out = document.getElementById("w-p2p-preview"); if (!out) return;
  const f = FREQ[valOf("w-freq")] ? valOf("w-freq") : "monthly";
  const v = num(valOf("w-val")), r = num(valOf("w-rate")), m = (num(valOf("w-monthly")) || 0) * FREQ[f].perMonth, n = parseInt(valOf("w-tenure"),10) || 12;
  const re = !!(document.getElementById("w-reinvest")||{}).checked;
  if (!(isFinite(v) && v > 0 && isFinite(r) && r > 0)){ out.textContent = "Enter the amount lent and the interest rate."; return; }
  const pl = p2pPlan(v, r, m, re, n);
  out.innerHTML = `Monthly interest now ≈ <b>${inr(v*r/100/12)}</b>. In ${n} months: <b>${inr(pl.end)}</b> (${inr(pl.interest)} interest${m ? `, ${inr(pl.added)} added by you` : ""}${re ? "" : ", interest paid out"}).`;
}

window.__nativeFetchDone = (id, code, body) => {

  if (code >= 200 && code < 300 && body != null){ try { p.res(JSON.parse(body)); } catch(e){ p.rej(e); } }

function getJSON(url){

    try { bridge.fetch(id, url); } catch(e){ delete pendingFetch[id]; rej(e); }
  });
  return fetch(url).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}

const RANGES = {"1M":{yf:"1mo", iv:"1d", days:31}, "6M":{yf:"6mo", iv:"1d", days:183}, "1Y":{yf:"1y", iv:"1d", days:366}, "5Y":{yf:"5y", iv:"1wk", days:1827}};

const charts = {};
function priceChart(pts, avg){
  const W = 320, H = 150, top = 14, bottom = 22, left = 4, right = 4;
  const vs = pts.map(p => p.v).concat(avg ? [avg] : []);
  let min = Math.min(...vs), max = Math.max(...vs); const pad0 = (max - min) * 0.08 || max * 0.02 || 1; min -= pad0; max += pad0;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t || t0 + 1;
  const x = t => left + (W-left-right) * (t1===t0 ? 0.5 : (t - t0)/(t1 - t0));
  const y = v => top + (H-top-bottom) * (1 - (v - min)/(max - min));
  const up = pts[pts.length-1].v >= pts[0].v, col = up ? "var(--good)" : "var(--bad)";
  const path = pts.map((p,i) => `${i?"L":"M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area = `${path}L${x(t1).toFixed(1)},${H-bottom}L${x(t0).toFixed(1)},${H-bottom}Z`;
  const fmtD = t => { const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]}${t1 - t0 > 300*864e5 ? " " + yy(d.getFullYear()) : ""}`; };
  const fmtV = v => "₹" + v.toLocaleString("en-IN", {maximumFractionDigits: v < 100 ? 2 : 0});
  const hi = pts.reduce((a,b) => b.v > a.v ? b : a), lo = pts.reduce((a,b) => b.v < a.v ? b : a);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price chart">`;
  svg += `<defs><linearGradient id="pg${up?"u":"d"}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up ? "#11845a" : "#c4372f"}" stop-opacity=".18"/><stop offset="1" stop-color="${up ? "#11845a" : "#c4372f"}" stop-opacity="0"/></linearGradient></defs>`;
  for (let i=0;i<=3;i++){ const gy = top + (H-top-bottom)*i/3; svg += `<line x1="${left}" x2="${W-right}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="${i===3?1:.6}"/>`; }
  svg += `<path d="${area}" fill="url(#pg${up?"u":"d"})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  if (avg && avg > min && avg < max){ svg += `<line x1="${left}" x2="${W-right}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="var(--blue)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-right}" y="${(y(avg)-4).toFixed(1)}" text-anchor="end" style="fill:var(--blue)">Your avg ${fmtV(avg)}</text>`; }
  svg += `<text x="${x(hi.t).toFixed(1)}" y="${(y(hi.v)-5).toFixed(1)}" text-anchor="${x(hi.t) > W*0.8 ? "end" : x(hi.t) < W*0.2 ? "start" : "middle"}">High ${fmtV(hi.v)}</text>`;
  svg += `<text x="${x(lo.t).toFixed(1)}" y="${(y(lo.v)+12).toFixed(1)}" text-anchor="${x(lo.t) > W*0.8 ? "end" : x(lo.t) < W*0.2 ? "start" : "middle"}">Low ${fmtV(lo.v)}</text>`;
  const last = pts[pts.length-1];
  svg += `<circle cx="${x(last.t).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  svg += `<text x="${left}" y="${H-6}">${fmtD(t0)}</text><text x="${W-right}" y="${H-6}" text-anchor="end">${fmtD(t1)}</text>`;
  return svg + `</svg>`;
}
function drawChart(id){
  const box = document.getElementById("ch-"+id), a = state.items.get(id); if (!box || !a) return;
  const range = (state.chartRange||{})[id] || "6M", c = charts[id+"|"+range];

}
async function loadChart(id, force){

const valOf = id => (document.getElementById(id)||{}).value || "";

const yy = y => String(y).slice(2);
function periodLabel(p){

  if (p.from===p.to) return `${MON[a.m-1]} ${yy(a.y)}`;
  if (a.m===1 && b.m===12) return a.y===b.y ? String(a.y) : `${a.y}–${yy(b.y)}`;

}
function periodRange(p){ const a = ymOf(p.from), b = ymOf(p.to); return [new Date(a.y, a.m-1, 1), new Date(b.y, b.m, 0, 23, 59, 59, 999)]; }

function goalMoney(g){

    else if (m.exp > s.budget) tips.push({text:`You are ${inr(m.exp - s.budget)} over budget. Pause non-essential spending until next month.`});
    const ef = byKind("goal").some(([,g]) => /emergency/i.test(g.title));
    if (!ef){ const avgExp = m.exp || 0; tips.push({text:`Start an emergency fund goal${avgExp ? ` of about ${short(avgExp*6)} (6 months of this month's spending)` : ""}.`, goal:{title:"Build a 6-month emergency fund", amount: avgExp ? Math.round(avgExp*6/1000)*1000 : 0}}); }
    const behind = byKind("goal").filter(([,g]) => isMoney(g) && ["behind","overdue"].includes(goalMoney(g).status));
    if (behind.length){ const need = behind.reduce((t,[,g]) => t + Math.max(0, goalMoney(g).needed - goalMoney(g).thisMonth), 0);
      tips.push({text:`${behind.length} money goal${behind.length>1?"s are":" is"} behind this month. Put aside ${inr(need)} more to get back on track.`}); }
    if (byKind("liability").some(([,l]) => /credit/i.test(l.type))) tips.push({text:"Clear credit card dues first. They usually carry the highest interest of any loan."});
    if (!byKind("asset").length) tips.push({text:"Add your bank balance and investments in Money → Wealth to see your net worth."});
  }
  if (k==="mind"){
    const log = journalLog(); let n = 0, low = 0;
    for (let i=0;i<7;i++){ const dk = dayKey(shift("day", state.now, i)); if (log[dk]) n++; const j = state.items.get("j-"+dk); if (j && (j.mood==="1" || j.mood==="2")) low++; }
    if (n < 4) tips.push({text:`You wrote the journal on ${n} of the last 7 days. Aim for 4. A 22:00 reminder helps.`, preset:3});
    if (low >= 2) tips.push({text:`Your mood was low on ${low} days this week. Note what drained you, and plan one thing you enjoy for tomorrow.`});
  }
  if (!gs.length) tips.push({text:`Set one ${a.label.toLowerCase()} goal, e.g. "${a.goal}".`, goal:{title:a.goal}});
  if (!hs.length && !has(a.habit)) tips.push({text:`Add a small habit, e.g. "${a.habit}". Small daily actions move big goals.`, habit:a.habit});
  for (const [,g] of gs){ if (!isMoney(g) && (Number(g.progress)||0) < 20 && (Date.now() - (g.created||Date.now())) > 14*864e5) { tips.push({text:`"${g.title}" hasn't moved much. Break it into one weekly task and add it to your plan.`}); break; } }
  if (!tips.length) tips.push({text:`${a.label} is going well. Keep your streaks going and raise one target a little.`});
  return tips.slice(0,5);
}

function mapSvg(sc, sel){
  const cx = 180, cy = 168, R = 122, r = 33, C = 2*Math.PI*r;
  let lines = "", nodes = "";
  sc.list.forEach((a,i) => {
    const ang = (-90 + i*360/sc.list.length) * Math.PI/180, x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
    const on = a.k===sel, p = a.score===null ? 0 : a.score/100;
    lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${on ? "var(--blue)" : "var(--line)"}" stroke-width="${on ? 2.5 : 1.5 + Math.min(3, (a.goals + a.habits)*0.5)}"/>`;
    nodes += `<g data-act="area" data-k="${a.k}" role="button" aria-label="${a.label} ${a.score===null ? "not started" : a.score+"%"}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${on ? "var(--blue-soft)" : "var(--surface)"}" stroke="var(--line)" stroke-width="4"/>
      ${p > 0 ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="none" stroke="${scoreColor(a.score)}" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x.toFixed(1)} ${y.toFixed(1)})"/>` : ""}
      <text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${a.label}</text>
      <text x="${x.toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">${a.score===null ? "–" : a.score+"%"}</text>
      <text x="${x.toFixed(1)}" y="${(y+r+13).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${a.goals} goal${a.goals===1?"":"s"} · ${a.habits} habit${a.habits===1?"":"s"}</text>
    </g>`;
  });
  return `<svg class="mindmap" viewBox="0 0 360 352" role="group" aria-label="Life map">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>
    ${lines}
    <circle cx="${cx}" cy="${cy}" r="44" fill="var(--blue)"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="11" font-weight="600" fill="#dbe6fb">You</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${sc.overall===null ? "–" : sc.overall+"%"}</text>
    ${nodes}</svg>`;
}

function renderWealth(){

  const types = {};

function holdingRow(id, a){
  const units = Number(a.units)||0, price = Number(a.price)||0, value = units*price, avg = Number(a.avg)||0, inv = units*avg;
  const gain = avg ? value - inv : null, day = a.prevClose ? (price - a.prevClose)/a.prevClose*100 : null;
  const mf = a.live.src==="mf";
  return `<li style="flex-direction:column;align-items:stretch;gap:8px">
    <div class="row"><span class="cat inc">${mf ? "MF" : "ST"}</span>
      <div class="main"><span class="title">${esc(a.name)}</span><span class="meta">${esc(mf ? `Scheme ${a.live.id}` : a.live.id)} · ${units.toLocaleString("en-IN")} ${mf ? "units" : "shares"}</span></div>
      <span class="amt">${price ? inr(value) : "–"}</span>${delBtn(id)}</div>
    <div class="between small"><span class="muted">${price ? `${mf ? "NAV" : "Price"} ₹${price.toLocaleString("en-IN",{maximumFractionDigits:2})}${day!==null ? ` <span class="${day>=0?"pos":"neg"}">${day>=0?"+":""}${day.toFixed(2)}% today</span>` : ""}` : "Price not loaded yet. Tap Refresh prices."}</span>
      <span class="tiny muted">${a.priceAsOf ? esc(a.priceAsOf) : ""}</span></div>
    ${gain!==null && price ? `<div class="between small"><span class="muted">Invested ${inr(inv)}</span><span class="${gain>=0?"pos":"neg"}"><b>${gain>=0?"+":"−"}${inr(gain)}</b> (${inv ? (gain/inv*100).toFixed(1) : 0}%)</span></div>` : ""}
    <details class="winbox" id="hc-${id}" data-chart="${id}"><summary>Price chart</summary><div id="ch-${id}"></div></details>
    <details class="winbox" id="hd-${id}"><summary>Edit holding</summary>
      <div class="grid2">
        <label class="flabel" for="hu-${id}">${mf ? "Units" : "Quantity"}<input class="field" id="hu-${id}" data-hold="units" data-hid="${id}" inputmode="decimal" value="${units}"></label>
        <label class="flabel" for="ha-${id}">${mf ? "Average NAV ₹" : "Average buy price ₹"}<input class="field" id="ha-${id}" data-hold="avg" data-hid="${id}" inputmode="decimal" value="${avg || ""}" placeholder="Optional"></label>
      </div>
    </details>
  </li>`;
}
function wealthRow(id, a, isL){
  if (!isL && isP2P(a)) return p2pRow(id, a);
  if (!isL && isLive(a)) return holdingRow(id, a);
  const upd = a.updated ? new Date(a.updated) : null;
  return `<li><span class="cat ${isL?"":"inc"}">${initials(a.type)}</span>
    <div class="main"><span class="title">${esc(a.name)}</span><span class="meta">${esc(a.type)}${upd?` · updated ${upd.getDate()} ${MON[upd.getMonth()]}`:""}</span></div>

    ${delBtn(id)}</li>`;
}

function renderHealth(){
  const s = settings(), k = dayKey(state.now), h = healthDay(k);
  const metrics = {water:["Water","glasses",s.waterGoal], sleep:["Sleep","hours",s.sleepGoal], steps:["Steps","steps",s.stepsGoal], workout:["Workout","min",s.workoutGoal], weight:["Weight","kg",0]};
  const mk = state.hmetric;
  const vals = []; for (let i=6;i>=0;i--){ const d = shift("day", state.now, i), hd = healthDay(dayKey(d)); vals.push({label:DAYS[d.getDay()].slice(0,2), v:Number(hd[mk])||0}); }
  const weights = byKind("health").filter(([,x])=>x.weight).sort((a,b)=>a[1].date.localeCompare(b[1].date));
  const lastW = weights.length ? weights[weights.length-1][1] : null, firstW = weights.length ? weights[Math.max(0, weights.length-30)][1] : null;
  const fmtSteps = v => v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,"")+"k" : v;
  const metricInput = (key, label, unit, goal, step) => `<div class="card metric"><span class="label">${label}</span>
    <div class="row"><input class="field" id="hm-${key}" data-h="${key}" inputmode="decimal" placeholder="0" value="${h[key]??""}" aria-label="${label} in ${unit}" style="flex:1"><span class="unit">${unit}</span></div>
    ${goal ? bar((Number(h[key])||0)/goal*100, (Number(h[key])||0)>=goal?"good":"") + `<span class="tiny muted">Goal ${Number(goal).toLocaleString("en-IN")} ${unit}</span>` : ""}</div>`;

  return `<div class="card">
    <div class="between"><span class="label">Water today</span><span class="chip ${(h.water||0)>=s.waterGoal?"good":""}">${(h.water||0)>=s.waterGoal?"Goal reached":`${s.waterGoal-(h.water||0)} more to go`}</span></div>
    <div class="between">
      <span class="big">${h.water||0}<span class="unit"> / ${s.waterGoal} glasses</span></span>
      <div class="stepper"><button data-act="water" data-d="-1" aria-label="Remove a glass">−</button><button data-act="water" data-d="1" aria-label="Add a glass">+</button></div>
    </div>
    ${bar((h.water||0)/s.waterGoal*100, (h.water||0)>=s.waterGoal?"good":"")}
  </div>
  <div class="grid2">
    ${metricInput("sleep","Sleep","hours",s.sleepGoal)}
    ${metricInput("steps","Steps","steps",s.stepsGoal)}
    ${metricInput("workout","Workout","min",s.workoutGoal)}
    ${metricInput("weight","Weight","kg",0)}
  </div>
  ${lastW ? `<div class="card"><div class="between"><span class="label">Weight</span><span class="small muted">Last logged ${parseDay(lastW.date).getDate()} ${MON[parseDay(lastW.date).getMonth()]}</span></div>
    <div class="between"><span class="big">${lastW.weight}<span class="unit"> kg</span></span>${firstW && firstW!==lastW ? (() => { const dlt = (lastW.weight - firstW.weight); return `<span class="chip ${dlt<=0?"good":"warn"}">${dlt>0?"+":""}${dlt.toFixed(1)} kg since ${parseDay(firstW.date).getDate()} ${MON[parseDay(firstW.date).getMonth()]}</span>`; })() : ""}</div></div>` : ""}
  <div class="card">
    <div class="between"><h3>Last 7 days</h3></div>
    ${seg(Object.entries(metrics).map(([k2,[l]])=>[k2,l]), mk, "hmetric")}
    ${barChart(vals, metrics[mk][2], mk==="steps" ? fmtSteps : null)}
    <span class="tiny muted">${metrics[mk][2] ? `Dashed line: goal of ${Number(metrics[mk][2]).toLocaleString("en-IN")} ${metrics[mk][1]}` : `In ${metrics[mk][1]}`}</span>
  </div>
  <div class="card">
    <h3>Daily goals</h3>
    <form class="stack" id="hg-form">
      <div class="grid2">
        <label class="flabel" for="g-water">Water <span>glasses</span><input class="field" id="g-water" inputmode="numeric" value="${s.waterGoal}"></label>
        <label class="flabel" for="g-sleep">Sleep <span>hours</span><input class="field" id="g-sleep" inputmode="decimal" value="${s.sleepGoal}"></label>
        <label class="flabel" for="g-steps">Steps <span>per day</span><input class="field" id="g-steps" inputmode="numeric" value="${s.stepsGoal}"></label>
        <label class="flabel" for="g-workout">Workout <span>minutes</span><input class="field" id="g-workout" inputmode="numeric" value="${s.workoutGoal}"></label>
      </div>
      <button class="btn ghost" type="submit">Save goals</button>
    </form>
  </div>`;
}

const EXPERT_RULES = `You are an expert inside LifeOS, a personal life app used by one person in India. Your role is given below.
How to answer:
- Reply in the language the person writes in. If they mix Tamil and English in Latin letters, reply the same way with simple words.
- Search the web for current facts, because rules, tax rates, prices, laws and standards in India change. Prefer official and reputable sources: government and regulator sites (Income Tax Department, GST portal, RBI, SEBI, IRDAI, BIS), manufacturers and well-known publications. Say the year of a rule or price when it matters.
- Keep the person safe. For anything that can hurt their life, health, money or legal position, say clearly what they can safely do themselves and when they must stop and hire a licensed professional. Don't give step-by-step instructions for work that needs a licence beyond safe checks.
- Protect them from fraud. Never ask for passwords, OTPs, PINs, full card, bank or Aadhaar numbers. If something sounds like a scam, say so and what to do. Remind them to verify a professional's registration (ICAI number for a CA, SEBI registration for an investment adviser, Council of Architecture registration, a licensed electrical contractor).
- Be honest. Don't invent figures; if you need details, ask one or two short questions.
- Be practical and brief: lead with the answer, then steps, then cautions. Short bullet points. Money in ₹ with Indian number format (₹1,25,000).
- This is general guidance, not a signed professional opinion.`;
function expertNotes(k){ return byKind("xnote").filter(([,n]) => n.expert===k); }
function expertSystem(ex){
  const kn = KNOWLEDGE[ex.k] || {facts:[], src:[]}, notes = expertNotes(ex.k).slice(-30);
  return [EXPERT_RULES, "",
    `Your role: ${ex.n} - ${ex.role}.`, "",
    "Your working knowledge (verify any number that may have changed with a web search before quoting it):",
    ...kn.facts.map(f => "- " + f), "",
    "Sources you trust most (search these first, and say when you rely on another source):",
    ...kn.src.map(x => "- " + x),
    notes.length ? "\nWhat this person has told you to remember (use it, don't repeat it back):" : "",
    ...notes.map(([,n]) => "- " + String(n.text).slice(0, 1200)),
    "", `Today is ${dayKey(new Date())}.`].filter(x => x !== undefined).join("\n");
}

function searchTrusted(ex, q){
  const hosts = ((KNOWLEDGE[ex.k] || {}).src || []).filter(x => /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(x)).slice(0, 8);
  const query = q + (hosts.length ? " (" + hosts.map(h => "site:" + h).join(" OR ") + ")" : "");
  logExpertNote(ex.k, q, "Searched trusted sites: " + (hosts.join(", ") || "the web") + ".");
  render(); openExternal("https://www.google.com/search?q=" + encodeURIComponent(query));

function mdLite(t){
  const lines = esc(t).split(/\n/), out = []; let list = null;
  const inline = x => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1">$1</a>');
  for (const raw of lines){
    const l = raw.trim();
    const ul = /^[-*•]\s+(.*)/.exec(l), ol = /^\d+[.)]\s+(.*)/.exec(l), h = /^#{1,4}\s+(.*)/.exec(l);
    if (ul || ol){ const tag = ul ? "ul" : "ol"; if (!list || list.tag !== tag){ if (list) out.push(`</${list.tag}>`); out.push(`<${tag}>`); list = {tag}; } out.push(`<li>${inline((ul||ol)[1])}</li>`); continue; }
    if (list){ out.push(`</${list.tag}>`); list = null; }
    if (h) out.push(`<h4>${inline(h[1])}</h4>`); else if (l) out.push(`<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list.tag}>`);
  return out.join("");
}

const BK_LAST = "lifeos-backup-at", BK_AUTO = "lifeos-backup-auto";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const canFileBackup = () => !!(bridge && typeof bridge.backupPick === "function");
const backupJSON = () => JSON.stringify({app:"lifeos", version:2, exported:new Date().toISOString(), items:Object.fromEntries(state.items)});
const backupName = "LifeOS-backup.json";
function fileBackupInfo(){ try { return bridge.hasBackupFile() ? (bridge.backupFileName() || backupName) : ""; } catch(e){ return ""; } }
let backupSilent = false;
window.__backupDone = (ok, name, msg) => {
  if (ok){ lsSet(BK_LAST, String(Date.now())); if (lsGet(BK_AUTO, null) === null) lsSet(BK_AUTO, "1"); }
  if (!backupSilent || !ok){ if (msg !== "cancelled") toast(ok ? `Backed up to ${name || "your file"}` : (msg || "Backup failed")); }
  backupSilent = false; state.backupBusy = false; render();
};
window.__restoreData = (text, name, msg) => {
  state.backupBusy = false;
  if (text == null){ if (msg !== "cancelled") toast(msg || "Couldn't read the file"); render(); return; }
  state.pendingRestore = {text, name}; render(); window.scrollTo(0, 0);
};
function importBackup(text){
  const data = JSON.parse(text);
  if (!data || !["lifeos","vaazhkai-tracker"].includes(data.app) || typeof data.items !== "object") throw new Error("not a backup");
  let n = 0;
  for (const [k,v] of Object.entries(data.items)) if (v && typeof v==="object" && typeof v.kind==="string"){ state.items.set(k,v); n++; }
  state.jdraft = null; afterChange("*");
  return {n, when: data.exported ? new Date(data.exported) : null};
}
function autoBackup(){
  if (!canFileBackup() || lsGet(BK_AUTO, "1") !== "1" || !fileBackupInfo()) return;
  const last = Number(lsGet(BK_LAST, 0));
  if (dayKey(new Date(last)) === dayKey(new Date())) return;
  backupSilent = true; try { bridge.backupSave(backupJSON()); } catch(e){ backupSilent = false; }
}
function renderBackup(){
  const file = canFileBackup() ? fileBackupInfo() : "", last = Number(lsGet(BK_LAST, 0)), auto = lsGet(BK_AUTO, "1") === "1";
  const pr = state.pendingRestore;
  let prInfo = "";

      prInfo = `${n} items${w ? `, saved ${w.getDate()} ${MON[w.getMonth()]} ${w.getFullYear()} ${pad(w.getHours())}:${pad(w.getMinutes())}` : ""}`; }
    catch(e){ prInfo = "This file isn't a LifeOS backup."; } }
  const lastTxt = last ? (() => { const d = new Date(last); return `${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; })() : "";
  return `${pr ? `<div class="card" style="border-color:var(--blue)">

      <span class="small muted">Items in the backup replace the same items on this phone. Anything added after the backup stays.</span>
      <div class="grid2"><button class="btn ghost" data-act="restore-cancel">Cancel</button><button class="btn" data-act="restore-confirm">Restore</button></div>
    </div>` : ""}
  ${canFileBackup() ? `<div class="card">
    <h3>Google Drive backup</h3>
    ${file ? `<div class="notice" style="padding:10px 12px"><div class="main"><span class="small"><b>${esc(file)}</b></span><span class="tiny muted">${lastTxt ? `Last backup ${lastTxt}` : "Not backed up yet"}</span></div></div>
      <div class="grid2"><button class="btn" data-act="backup-now" ${state.backupBusy ? "disabled" : ""}>${state.backupBusy ? "Saving…" : "Back up now"}</button><button class="btn ghost" data-act="backup-pick">Change location</button></div>
      <label class="checkline" for="bk-auto"><input type="checkbox" id="bk-auto" data-live="1" ${auto ? "checked" : ""}> Back up automatically once a day</label>`
    : `<span class="small muted">Save your data as a file in Google Drive, so you can get it back on a new phone or after reinstalling.</span>
      <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
        <li>Tap <b>Back up to Google Drive</b>.</li>

        <li>Tap <b>Save</b>. Next time LifeOS saves to the same file by itself.</li>
      </ol>
      <button class="btn block" data-act="backup-pick">Back up to Google Drive</button>`}
  </div>
  <div class="card">
    <h3>Restore</h3>
    <span class="small muted">Pick your LifeOS-backup.json from Google Drive (LifeOS Backups folder).</span>
    <div class="grid2">${file ? `<button class="btn ghost" data-act="restore-saved">Restore last backup</button>` : ""}<button class="btn ghost ${file ? "" : "block"}" data-act="restore-pick" ${file ? "" : 'style="grid-column:1/-1"'}>Restore from file</button></div>
  </div>` : ""}

    </div>
  </details>
  <span class="tiny muted">${state.items.size} items stored on this phone. Uninstalling LifeOS or clearing its data deletes them, so keep a backup.</span>`;

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, it = id ? state.items.get(id) : null;
  if (act==="go"){ go(b.dataset.tab, {plan:b.dataset.plan, money:b.dataset.money, more:b.dataset.more, goals:b.dataset.goals}); return; }
  if (act==="plan" || act==="money" || act==="more" || act==="goals"){ state[act] = b.dataset.k; saveView(); render(); if (act==="money" && b.dataset.k==="wealth") refreshPrices(false); return; }
  if (act==="area"){ state.area = b.dataset.k; render(); return; }
  if (act==="gmode"){ const t = document.getElementById("g-title"); state.goalTitle = t ? t.value : ""; state.goalMode = b.dataset.k; render(); return; }
  if (act==="area-goal"){ state.goalArea = b.dataset.k; state.goalMode = b.dataset.k==="wealth" ? "money" : "progress"; state.goalTitle = ""; go("goals", {goals:"list"}); setTimeout(()=>{ const t = document.getElementById("g-title"); t && t.focus(); }, 50); return; }
  if (act==="area-habit"){ state.planArea = b.dataset.k; go("plan", {plan:"daily"}); setTimeout(()=>{ const t = document.getElementById("new-title"); t && t.focus(); }, 50); return; }
  if (act==="tip"){
    const t = state.lastTips && state.lastTips[Number(b.dataset.i)]; if (!t) return;
    if (t.habit){ setItem(newId(), {kind:"daily", title:t.habit, area:state.area || (lifeScores().weakest||{}).k || guessArea(t.habit), log:{}, created:Date.now()}); toast(`Habit added: ${t.habit}`); }
    else if (t.goal){ state.goalTitle = t.goal.title; state.goalAmount = t.goal.amount || ""; state.goalArea = guessArea(t.goal.title)==="personal" ? (state.area||"personal") : guessArea(t.goal.title); state.goalMode = t.goal.amount !== undefined ? "money" : "progress"; go("goals", {goals:"list"}); }
    else if (t.preset !== undefined){ const p = PRESETS[t.preset]; addReminder({kind:"reminder", title:p.title, time:p.time, repeat:p.repeat, date:"", dom:p.dom||1, enabled:true, created:Date.now()}); }
    return;
  }
  if (act==="contrib" && it){
    const inp = document.getElementById("gc-"+id), raw = inp && inp.value.trim();
    const m = moneyOf(it), v = raw ? num(raw) : (m.upcoming ? NaN : Math.max(0, m.needed - m.thisMonth));
    if (!isFinite(v) || v===0){ toast("Enter the amount you put aside. Use a minus sign to take money out."); return; }
    addContribution(id, it, v); return;
  }
  if ((act==="p2p-int" || act==="p2p-add") && it){
    const cm = monthKey(state.now), plog = {...(it.p2pLog||{})}, cur = {...(plog[cm]||{})}, alog = {...(it.addLog||{})};
    let value = Number(it.value)||0;
    if (act==="p2p-int"){
      if (cur.int){ if (it.reinvest!==false) value -= Number(cur.int); delete cur.int; toast("Interest entry removed"); }
      else { const x = p2pMonthlyInterest(it); cur.int = x; if (it.reinvest!==false) value += x; toast(`Interest ${inr(x)} added${it.reinvest!==false ? " and re-lent" : ""}`); }
    } else {
      const f = freqOf(it), k = periodKey(FREQ[f].p, state.now), done = p2pAddedThis(it);
      if (done){ value -= done; delete alog[k]; if (f==="monthly") delete cur.add; toast("Contribution removed"); }

    }

  if (act==="live-search"){

    state.wPick = null; state.wSearching = true; state.wErr = ""; state.wResults = []; renderLiveResults();
    searchLive(src, q).then(r => { state.wResults = r; state.wErr = r.length ? "" : "No matches. Try another spelling."; })

      .finally(() => { state.wSearching = false; renderLiveResults(); });

  }
  if (act==="live-pick"){
    const x = (state.wResults||[])[Number(b.dataset.i)]; if (!x) return;

  }
  if (act==="live-clear"){ state.wPick = null; renderLiveResults(); liveFormText(); return; }
  if (act==="refresh-prices"){ refreshPrices(true); return; }
  if (act==="geo-allow"){ try { bridge.requestLocation(false); } catch(_){} return; }
  if (act==="geo-bg"){ try { bridge.requestLocation(true); } catch(_){ try { bridge.openAppSettings(); } catch(__){} } return; }
  if (act==="x-savekn"){
    const m = (chatsLoad()[state.xOpen] || [])[Number(b.dataset.i)]; if (!m) return;
    const text = String(m.text).replace(/\*\*/g, "").slice(0, 1200);
    setItem(newId(), {kind:"xnote", expert:state.xOpen, text, created:Date.now()});
    toast("Saved to this expert's knowledge"); return;
  }
  if (act==="x-open"){ state.xOpen = b.dataset.k; render(); window.scrollTo(0,0); return; }
  if (act==="x-back"){ state.xOpen = null; render(); window.scrollTo(0,0); return; }
  if (act==="x-q"){ const ex = EXPERTS.find(x => x.k===state.xOpen); if (ex){ const q = ex.q[Number(b.dataset.i)]; hasExpertKey() ? askExpert(ex.k, q) : askInClaude(ex, q); } return; }
  if (act==="x-claude" || act==="x-search"){
    const ex = EXPERTS.find(x => x.k===state.xOpen); if (!ex) return;
    const q = valOf("x-in").trim(); if (!q){ toast("Type your question first"); return; }
    const el = document.getElementById("x-in"); if (el) el.value = "";
    act==="x-claude" ? askInClaude(ex, q) : searchTrusted(ex, q); return;
  }
  if (act==="x-clear"){
    if (armed !== "x-clear"){ armed = "x-clear"; b.textContent = "Tap again to clear"; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000); return; }
    armed = null; const c = chatsLoad(); delete c[state.xOpen]; chatsSave(c); render(); return;
  }
  if (act==="x-key-save"){
    const k = valOf("x-key").trim();
    if (!/^sk-ant-/.test(k) || k.length < 30){ toast("That doesn't look like an Anthropic API key (it starts with sk-ant-)."); return; }
    try { if (bridge.setExpertKey(k)){ toast("API key saved on this phone"); render(); } else toast("Couldn't save the key."); } catch(_){ toast("Update the app to use experts."); }
    return;
  }
  if (act==="x-key-remove"){
    if (armed !== "x-key"){ armed = "x-key"; b.textContent = "Tap again to remove"; clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000); return; }
    armed = null; try { bridge.setExpertKey(""); } catch(_){} toast("API key removed"); render(); return;
  }
  if (act==="fs-settings"){ try { bridge.openFullScreenSettings(); } catch(_){} return; }
  if (act==="rem-done" && it){ toggleRemDone(id); return; }
  if (act==="rem-alarm" && it){ updateItem(id, {alarm: !it.alarm}); toast(it.alarm ? "Back to a normal notification" : "Will ring as an alarm"); return; }
  if (act==="r-day"){
    const d = Number(b.dataset.d), cur = new Set(state.rDays || ALL_DAYS);
    if (cur.has(d)){ if (cur.size === 1){ toast("Keep at least one day."); return; } cur.delete(d); } else cur.add(d);
    state.rDays = [...cur].sort(); render(); return;
  }
  if (act==="r-days"){ state.rDays = b.dataset.k.split("").map(Number); render(); return; }
  if (act==="rem-day" && it){
    const d = Number(b.dataset.d), cur = new Set(remDays(it) || ALL_DAYS);
    if (cur.has(d)){ if (cur.size === 1){ toast("Keep at least one day."); return; } cur.delete(d); } else cur.add(d);
    const days = [...cur].sort();
    updateItem(id, days.length===7 ? {repeat:"daily", days:[]} : {repeat:"days", days});

  }
  if (act==="gr-day"){
    const d = Number(b.dataset.d), cur = new Set(state.grDays || ALL_DAYS);
    if (cur.has(d)){ if (cur.size === 1){ toast("Keep at least one day."); return; } cur.delete(d); } else cur.add(d);
    state.grDays = [...cur].sort(); render(); return;
  }
  if (act==="gr-days"){ state.grDays = b.dataset.k.split("").map(Number); render(); return; }
  if (act==="georem-day" && it){
    const d = Number(b.dataset.d), cur = new Set(geoDays(it));
    if (cur.has(d)){ if (cur.size === 1){ toast("Keep at least one day."); return; } cur.delete(d); } else cur.add(d);
    updateItem(id, {days:[...cur].sort()}); toast(daysLabel([...cur])); return;
  }
  if (act==="pl-name"){ const n = document.getElementById("pl-name"); if (n) n.value = b.dataset.k; return; }
  if (act==="pl-here"){
    if (geoStatus()==="none"){ toast("Allow location first."); try { bridge.requestLocation(false); } catch(_){} return; }
    state.locBusy = true; render();
    currentLocation().then(p => { state.plFound = p; toast("Got your location"); })
      .catch(e => toast(e.message==="no_permission" ? "Allow location first." : "Couldn't get your location. Turn on location and try again outdoors."))
      .finally(() => { state.locBusy = false; render(); });
    return;
  }
  if (act==="chart-range"){ state.chartRange = {...(state.chartRange||{}), [id]: b.dataset.k}; loadChart(id, b.textContent==="Try again"); return; }
  if (act==="plan-contrib" && it){
    const m = moneyOf(it);
    if (m.thisMonth >= m.needed){ toast(`Already put aside ${inr(m.thisMonth)} this month. Change it in ${it.kind==="yearly" ? "the Yearly tab" : "Goals"}.`); return; }
    addContribution(id, it, m.needed - m.thisMonth); return;
  }
  if (act==="hmetric"){ state.hmetric = b.dataset.k; render(); return; }
  if (act==="txtype"){ state.txType = b.dataset.k; render(); return; }
  if (act==="wmode"){ state.liabMode = b.dataset.k==="liab"; render(); return; }
  if (act==="quick-exp"){ state.txType = "expense"; state.month = monthKey(state.now); go("money", {money:"spend"}); setTimeout(()=>{ const a = document.getElementById("tx-amt"); a && a.focus(); }, 50); return; }

  if (act==="toggle" && it){
    const kd = planOf(it.kind), key = periodKey(kd.period, state.now), log = {...(it.log||{})};
    if (log[key]) delete log[key]; else log[key] = Date.now();
    if (kd.period==="day"){ const cutoff = dayKey(shift("day", state.now, 800)); for (const k of Object.keys(log)) if (k < cutoff) delete log[k]; }
    updateItem(id, {log});
  }
  if (act==="todo" && it) updateItem(id, {done:!it.done, doneAt: it.done ? null : Date.now()});
  if (act==="edit"){ state.editing = state.editing===id ? null : id; render(); return; }
  if (act==="ed-cancel"){ state.editing = null; render(); return; }
  if (act==="ed-save" && it){
    const title = valOf("ed-title").trim();
    if (!title){ toast("The task needs a name."); return; }
    const next = {...it, title, area: valOf("ed-area") || itemArea(it)};
    delete next.win;
    if (it.kind==="yearly"){
      const r = readPeriod("ed"); if (r.err){ toast(r.err); return; } next.period = r.p;
      const a = valOf("ed-amt").trim() ? num(valOf("ed-amt")) : 0, sv = valOf("ed-saved").trim() ? num(valOf("ed-saved")) : 0;
      if (!isFinite(a) || a < 0 || !isFinite(sv) || sv < 0){ toast("Amounts must be numbers in rupees."); return; }
      if (a > 0){ next.amount = a; next.saved = sv; next.contrib = next.contrib || {}; } else { delete next.amount; delete next.saved; delete next.contrib; }
    }
    state.items.set(id, next);
    const rr = setPlanReminder(id, next, "ed");
    if (rr && rr.repeat==="once" && !nextFire(rr, new Date())){ toast("That reminder time has already passed. Pick a later time."); }
    else toast(next.period ? `Saved · ${periodLabel(next.period)}${hasMoney(next) && moneyOf(next).status!=="done" ? ` · ${inr(moneyOf(next).needed)} a month` : ""}` : rr ? `Saved · reminder ${whenLabel(nextFire(rr, new Date()))}` : "Saved");
    if (rr && bridge && !notifAllowed()){ try { bridge.requestNotifications(); } catch(_){} }
    state.editing = null; afterChange("reminder"); return;
  }
  if (act==="ge-cancel"){ state.editing = null; render(); return; }
  if (act==="ge-save" && it){
    const title = valOf("ge-title").trim(), start = valOf("ge-start"), by = valOf("ge-by");
    if (!title){ toast("The goal needs a name."); return; }
    if (!/^\d{4}-\d{2}$/.test(start) || !/^\d{4}-\d{2}$/.test(by)){ toast("Pick both months."); return; }
    if (by < start){ toast("\"Reach it by\" must be on or after \"Start from\"."); return; }
    const next = {...it, title, area: valOf("ge-area") || itemArea(it), start, by};
    delete next.target;
    if (isMoney(it)){ const a = num(valOf("ge-amt")); if (!isFinite(a) || a <= 0){ toast("Enter the target amount in rupees."); return; } next.amount = a; }
    state.items.set(id, next); state.editing = null; afterChange("goal");
    toast(isMoney(next) && goalMoney(next).status!=="done" ? `Saved · ${inr(goalMoney(next).needed)} a month` : "Saved");
    return;
  }
  if (act==="pset"){
    const p = b.dataset.p, f = document.getElementById(p+"-pfrom"), t = document.getElementById(p+"-pto");
    if (f && t){ f.value = b.dataset.f; t.value = b.dataset.t; }
    calcMonthly(p);
    return;
  }
  if (act==="prog" && it) updateItem(id, {progress: Math.max(0, Math.min(100, (it.progress||0) + Number(b.dataset.d)))});
  if (act==="del"){
    if (armed === id){ clearTimeout(armTimer); armed = null; if (id.startsWith("j-")) state.jdraft = null; removeItem(id); return; }
    document.querySelectorAll(".del.arm").forEach(x=>{ x.classList.remove("arm"); x.textContent = x.dataset.label || "Delete"; });
    b.dataset.label = b.textContent; armed = id; b.classList.add("arm"); b.textContent = "Confirm";
    clearTimeout(armTimer); armTimer = setTimeout(()=>{ armed=null; b.classList.remove("arm"); b.textContent = b.dataset.label; }, 3500);
  }
  if (act==="clear-done"){ byKind("todo").filter(([,t])=>t.done).forEach(([tid])=>state.items.delete(tid)); afterChange("todo"); }
  if (act==="starter"){
    const base = Date.now();
    STARTER.forEach(([kind,title,area],i) => {
      const data = {kind, title, area, created: base+i};
      if (kind==="todo") data.done = false;
      if (kind==="yearly"){ const y = state.now.getFullYear(); data.done = false; data.period = {from:`${y}-01`, to:`${y}-12`}; }
      else if (planOf(kind).period) data.log = {};
      state.items.set(newId()+i, data);
    });
    if (!byKind("goal").length){
      state.items.set(newId()+"g1", {kind:"goal", mode:"money", title:"Build a 6-month emergency fund", area:"wealth", amount:300000, saved:0, by:monthKey(new Date(state.now.getFullYear()+1, state.now.getMonth(), 1)), contrib:{}, created:base+20});
      state.items.set(newId()+"g2", {kind:"goal", mode:"progress", title:"Run 5 km without stopping", area:"health", progress:0, target:state.now.getFullYear()+1, created:base+21});
    }
    afterChange("todo"); toast("Starter plan added");
  }
  /* money */
  if (act==="mprev" || act==="mnext"){
    const d = parseDay(state.month+"-01"); d.setMonth(d.getMonth() + (act==="mprev" ? -1 : 1));
    if (monthKey(d) > monthKey(state.now)) return;
    state.month = monthKey(d); render();
  }
  /* health */
  if (act==="water"){
    const k = dayKey(state.now), cur = Number(healthDay(k).water)||0, nv = Math.max(0, cur + Number(b.dataset.d));
    setHealth(k, {water:nv});
    if (state.tab==="home") toast(`Water: ${nv} glass${nv===1?"":"es"} today`);
  }
  /* journal */
  if (act==="jprev" || act==="jnext"){
    const dd = shift("day", parseDay(state.jdate), act==="jprev" ? 1 : -1);
    if (dayKey(dd) > dayKey(state.now)) return;
    state.jdate = dayKey(dd); state.jdraft = null; render();
  }
  if (act==="jopen"){ state.jdate = b.dataset.date; state.jdraft = null; render(); window.scrollTo(0,0); }
  if (act==="mood"){ ensureDraft(); state.jdraft.mood = state.jdraft.mood===b.dataset.v ? "" : b.dataset.v; state.jsaved = false; render(); }
  if (act==="jsave"){
    ensureDraft();
    const dr = state.jdraft, jid = "j-"+dr.date, prev = state.items.get(jid);
    if (!hasContent(dr) && !prev){ toast("Write something or pick a mood first."); return; }
    state.items.set(jid, {kind:"journal", date:dr.date, mood:dr.mood, good:dr.good, better:dr.better, notes:dr.notes, created: prev?.created || Date.now(), updated: Date.now()});
    state.jsaved = true; afterChange("journal"); toast("Journal saved");
  }
  /* reminders */
  if (act==="ron" && it) updateItem(id, {enabled: it.enabled===false});
  if (act==="check-update"){ checkUpdate(true); return; }
  if (act==="notif"){ try { bridge.requestNotifications(); } catch(_){} }
  if (act==="preset"){
    const p = PRESETS[Number(b.dataset.i)]; if (!p) return;
    addReminder({kind:"reminder", title:p.title, time:p.time, repeat:p.repeat, date:"", dom:p.dom||1, enabled:true, created:Date.now()});
  }
  /* backup */
  if (act==="export"){
    const text = JSON.stringify({app:"lifeos", version:2, exported:new Date().toISOString(), items:Object.fromEntries(state.items)});
    if (bridge){ try { bridge.share(text, "LifeOS backup " + dayKey(state.now)); } catch(_){} }
    else if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("Backup copied"), ()=>toast("Couldn't copy. Try again."));
  }
  if (act==="import"){
    try { const r = importBackup(document.getElementById("b-in").value.trim()); toast(`Restored ${r.n} items`); }
    catch(_){ toast("That isn't a LifeOS backup. Paste the full backup text."); }
  }
  if (act==="backup-pick"){ try { bridge.backupPick(backupJSON(), backupName); } catch(_){ toast("Update the app to back up to Google Drive."); } return; }
  if (act==="backup-now"){ state.backupBusy = true; render(); try { bridge.backupSave(backupJSON()); } catch(_){ state.backupBusy = false; render(); } return; }
  if (act==="restore-pick"){ try { bridge.restorePick(); } catch(_){} return; }
  if (act==="restore-saved"){ try { bridge.restoreSaved(); } catch(_){} return; }
  if (act==="restore-cancel"){ state.pendingRestore = null; render(); return; }
  if (act==="restore-confirm" && state.pendingRestore){
    try { const r = importBackup(state.pendingRestore.text); state.pendingRestore = null; toast(`Restored ${r.n} items`); }
    catch(_){ state.pendingRestore = null; render(); toast("That file isn't a LifeOS backup."); }
    return;
  }
});

function addReminder(r){
  if (bridge && !notifAllowed()) { try { bridge.requestNotifications(); } catch(_){} }
  setItem(newId(), r);
  toast("Reminder set · " + whenLabel(nextFire(r, new Date())));
}

document.addEventListener("input", e => {

}, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="r-repeat") syncFormVisibility();
  if (t.id==="g-area") state.goalArea = t.value;

    setHealth(dayKey(state.now), {[t.dataset.h]: v});
  }
  if (t.dataset.cat){
    const v = t.value.trim()==="" ? 0 : num(t.value);
    if (!isFinite(v) || v < 0){ toast("Enter an amount in rupees."); return; }
    const cb = {...(settings().catBudgets||{})}; if (v) cb[t.dataset.cat] = v; else delete cb[t.dataset.cat];
    saveSettings({catBudgets:cb}, true); toast(v ? `${t.dataset.cat} limit: ${inr(v)}` : `${t.dataset.cat}: no limit`);

  if (t.id==="w-reinvest") p2pPreview();
  if (t.id==="x-share"){ state.xShare = t.checked; return; }
  if (t.id==="rf-full"){ saveSettings({remFull: t.checked}); syncReminders(); toast(t.checked ? "Reminders will show full screen" : "Reminders will show as notifications"); return; }
  if (t.id==="bk-auto"){ lsSet(BK_AUTO, t.checked ? "1" : "0"); toast(t.checked ? "Daily backup on" : "Daily backup off"); return; }
  if (t.dataset.hold){
    const it = state.items.get(t.dataset.hid); if (!it) return;
    const v = t.value.trim()==="" ? 0 : num(t.value);
    if (!isFinite(v) || v < 0 || (t.dataset.hold==="units" && v===0)){ toast("Enter a number."); return; }
    const patch = {[t.dataset.hold]: v}; if (t.dataset.hold==="units") patch.value = v*(Number(it.price)||0);
    updateItem(t.dataset.hid, patch); toast("Saved"); return;

  if (t.dataset.p2p){
    const it = state.items.get(t.dataset.pid); if (!it) return;
    const k = t.dataset.p2p;
    if (k==="reinvest"){ updateItem(t.dataset.pid, {reinvest:t.checked}); return; }
    if (k==="freq"){ updateItem(t.dataset.pid, {freq:t.value}); toast(`${FREQ[t.value].label} contribution · shows in Plan → ${FREQ[t.value].label}`); return; }
    const v = num(t.value);
    if (!isFinite(v) || v < 0 || (k==="tenure" && (v < 1 || v > 120))){ toast(k==="tenure" ? "Months must be 1 to 120." : "Enter a number."); return; }
    updateItem(t.dataset.pid, {[k]: k==="tenure" ? Math.round(v) : v}); toast("Saved");
  }
  if (t.dataset.wid){
    const v = num(t.value);
    if (!isFinite(v) || v < 0){ toast("Enter the current value in rupees."); return; }
    updateItem(t.dataset.wid, {value:v, updated:Date.now()}); toast("Value updated");
  }
});
document.addEventListener("submit", e => {

      return;
    }
    if (planOf(kind).period) data.log = {};
    if (kind==="todo") data.done = false;

    const box = document.getElementById("nw-remind"); if (box) box.open = false;
    afterChange("reminder");
    if (rr){ if (bridge && !notifAllowed()){ try { bridge.requestNotifications(); } catch(_){} }
      const nf = nextFire(rr, new Date()); toast(nf ? `Added · reminder ${whenLabel(nf)}` : "Added. The reminder time has already passed."); }
  }
  if (f.id==="g-form"){
    const title = val("g-title").trim(), area = val("g-area") || "personal";
